<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XA IA – Assistant Soninké v3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .chat-header {
      background: white;
      border-bottom: 1px solid #e2e8f0;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 36px; height: 36px;
      background: #e67e22;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
    }
    .logo-text { font-weight: 700; color: #2c1a0f; }
    .logo-text span { color: #e67e22; }
    .back-link {
      background: #f1f5f9;
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 0.8rem;
      text-decoration: none;
      color: #475569;
    }
    .lang-selector {
      display: flex;
      gap: 8px;
      background: #f1f5f9;
      padding: 4px 12px;
      border-radius: 40px;
    }
    .lang-btn {
      background: none;
      border: none;
      padding: 6px 12px;
      border-radius: 30px;
      font-weight: 500;
      cursor: pointer;
      color: #475569;
    }
    .lang-btn.active { background: #e67e22; color: white; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .message { display: flex; gap: 12px; max-width: 85%; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .message-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .message.user .message-avatar { background: #e67e22; color: white; }
    .message-content {
      background: white;
      padding: 12px 16px;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      line-height: 1.5;
    }
    .message.user .message-content {
      background: #e67e22;
      color: white;
      border: none;
    }
    .chat-input-area {
      background: white;
      border-top: 1px solid #e2e8f0;
      padding: 16px 20px;
    }
    .input-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 12px;
    }
    textarea {
      flex: 1;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      padding: 12px 18px;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #e67e22; }
    button {
      background: #e67e22;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .typing-indicator { display: flex; gap: 4px; padding: 8px 0; }
    .typing-indicator span {
      width: 8px; height: 8px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }
    @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-8px)} }
    @media (max-width: 640px) { .message { max-width: 95%; } .chat-header { flex-direction: column; gap: 8px; } }
  </style>
</head>
<body>
<div class="chat-header">
  <div class="logo-area">
    <div class="logo-icon">X</div>
    <div class="logo-text">XA <span>IA</span></div>
    <a href="xa-ia-hub.html" class="back-link">← Retour à l'espace</a>
  </div>
  <div class="lang-selector">
    <button class="lang-btn active" data-lang="fr">FR</button>
    <button class="lang-btn" data-lang="snk">Soninké</button>
    <button class="lang-btn" data-lang="en">EN</button>
  </div>
</div>
<div class="chat-messages" id="chatMessages">
  <div class="message bot">
    <div class="message-avatar">🤖</div>
    <div class="message-content"><strong>Beeta ! 👋</strong><br>Je suis XA IA, ton assistante soninké. Je peux chercher des informations sur des sites soninkés pour te répondre. Pose-moi une question !</div>
  </div>
</div>
<div class="chat-input-area">
  <div class="input-container">
    <textarea id="chatInput" rows="1" placeholder="Écris ton message... (Entrée pour envoyer)"></textarea>
    <button id="sendBtn">➤</button>
  </div>
</div>

<script>
  const API_URL = "https://xa-ia-worker.microsansfiltre2408.workers.dev";
  let currentLang = "fr";
  let isLoading = false;
  const messagesDiv = document.getElementById('chatMessages');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLang = btn.dataset.lang;
      addSystemMessage(`🧡 Langue changée : ${currentLang === 'fr' ? 'français' : currentLang === 'snk' ? 'soninké' : 'anglais'}.`);
    });
  });

  function addSystemMessage(text) {
    const div = document.createElement('div');
    div.className = 'message bot';
    div.innerHTML = `<div class="message-avatar">ℹ️</div><div class="message-content"><em>${text}</em></div>`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function addMessage(text, isUser = false) {
    const div = document.createElement('div');
    div.className = `message ${isUser ? 'user' : 'bot'}`;
    div.innerHTML = `<div class="message-avatar">${isUser ? '👤' : '🤖'}</div><div class="message-content">${text.replace(/\n/g, '<br>')}</div>`;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function showTyping() {
    const typing = document.createElement('div');
    typing.className = 'message bot';
    typing.id = 'typingIndicator';
    typing.innerHTML = `<div class="message-avatar">🤖</div><div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
    messagesDiv.appendChild(typing);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }
  function hideTyping() { document.getElementById('typingIndicator')?.remove(); }

  async function sendMessage() {
    const msg = input.value.trim();
    if (!msg || isLoading) return;
    addMessage(msg, true);
    input.value = '';
    isLoading = true;
    showTyping();
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg })
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      hideTyping();
      addMessage(data.response || "N nta a tu. Je n'ai pas compris.", false);
    } catch (err) {
      console.error("Fetch error:", err);
      hideTyping();
      addMessage("🔌 Je n'arrive pas à contacter mon serveur. Vérifie ta connexion. 🧡", false);
    }
    isLoading = false;
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);
</script>
</body>
</html>
