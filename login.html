<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Andu-Xara</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="js/firebase.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        body { background:linear-gradient(135deg, #f5f7fa 0%, #f8f9fa 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .login-container { background:white; padding:40px; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.1); width:100%; max-width:450px; margin:20px; }
        .logo { text-align:center; font-size:2rem; font-weight:800; color:#e67e22; margin-bottom:30px; }
        .logo span { color:#333; font-weight:300; }
        h1 { text-align:center; margin-bottom:30px; font-size:1.5rem; color:#333; }
        .form-group { margin-bottom:20px; }
        label { display:block; margin-bottom:8px; font-weight:600; color:#555; }
        input { width:100%; padding:12px 15px; border:1px solid #ddd; border-radius:8px; font-size:1rem; transition:border 0.2s; }
        input:focus { outline:none; border-color:#e67e22; }
        .btn { width:100%; padding:14px; background:#e67e22; color:white; border:none; border-radius:8px; font-size:1rem; font-weight:700; cursor:pointer; transition:background 0.2s; }
        .btn:hover { background:#d35400; }
        .btn-secondary { background:#2c3e50; margin-top:10px; }
        .btn-secondary:hover { background:#1a252f; }
        .switch { text-align:center; margin-top:20px; color:#666; }
        .switch a { color:#e67e22; text-decoration:none; font-weight:600; }
        .error { background:#fee; color:#c0392b; padding:12px; border-radius:8px; margin-bottom:20px; display:none; text-align:center; font-size:0.9rem; }
        .success { background:#e8f8f5; color:#27ae60; padding:12px; border-radius:8px; margin-bottom:20px; display:none; text-align:center; font-size:0.9rem; }
        .back-link { display:block; text-align:center; margin-top:20px; color:#999; text-decoration:none; font-size:0.9rem; }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">Andu<span>Xara</span></div>
    <h1 id="form-title">Connexion</h1>
    <div id="error-message" class="error"></div>
    <div id="success-message" class="success"></div>
    
    <form id="auth-form">
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" required placeholder="votre@email.com">
        </div>
        <div class="form-group">
            <label>Mot de passe</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn" id="submit-btn">Se connecter</button>
    </form>
    
    <div class="switch">
        <span id="switch-text">Pas encore de compte ?</span>
        <a href="#" id="switch-link">S'inscrire</a>
    </div>
    <a href="produits.html" class="back-link">← Continuer sans me connecter</a>
</div>

<script>
    let isLogin = true;
    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const submitBtn = document.getElementById('submit-btn');
    const switchLink = document.getElementById('switch-link');
    const switchText = document.getElementById('switch-text');
    const errorDiv = document.getElementById('error-message');
    const successDiv = document.getElementById('success-message');

    function showError(msg) { errorDiv.textContent = msg; errorDiv.style.display = 'block'; successDiv.style.display = 'none'; setTimeout(() => errorDiv.style.display = 'none', 4000); }
    function showSuccess(msg) { successDiv.textContent = msg; successDiv.style.display = 'block'; errorDiv.style.display = 'none'; setTimeout(() => successDiv.style.display = 'none', 3000); }

    switchLink.onclick = (e) => {
        e.preventDefault();
        isLogin = !isLogin;
        if (isLogin) {
            title.textContent = 'Connexion';
            submitBtn.textContent = 'Se connecter';
            switchText.textContent = 'Pas encore de compte ?';
            switchLink.textContent = "S'inscrire";
        } else {
            title.textContent = 'Inscription';
            submitBtn.textContent = "S'inscrire";
            switchText.textContent = 'Déjà un compte ?';
            switchLink.textContent = 'Se connecter';
        }
    };

    form.onsubmit = async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            if (isLogin) {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                showSuccess('✅ Connexion réussie ! Redirection...');
                setTimeout(() => window.location.href = 'produits.html', 1500);
            } else {
                await firebase.auth().createUserWithEmailAndPassword(email, password);
                showSuccess('✅ Inscription réussie ! Redirection...');
                setTimeout(() => window.location.href = 'produits.html', 1500);
            }
        } catch (err) {
            if (err.code === 'auth/user-not-found') showError('❌ Email ou mot de passe incorrect');
            else if (err.code === 'auth/wrong-password') showError('❌ Mot de passe incorrect');
            else if (err.code === 'auth/email-already-in-use') showError('❌ Cet email est déjà utilisé');
            else if (err.code === 'auth/weak-password') showError('❌ Mot de passe trop faible (6+ caractères)');
            else showError('❌ ' + err.message);
        }
    };
</script>
<script src="https://quge5.com/88/tag.min.js" data-zone="242166" async data-cfasync="false"></script>
    <script src="https://pl29532875.effectivecpmnetwork.com/b2/17/30/b217308e3a8b9c5b77f2129d8581d911.js"></script>
</body>
</html>
