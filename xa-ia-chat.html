<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Assistant XA IA — Andu-Xara</title>
    <meta name="description" content="Discutez avec XA IA, l'assistant intelligent d'Andu-Xara. Posez vos questions sur la langue soninké, la culture, les produits et le concert.">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #e67e22;
            --primary-dark: #d35400;
            --primary-light: #f39c12;
            --earth: #2c1a0f;
            --border: #e2e8f0;
            --background: #f8fafc;
            --muted: #475569;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Header */
        .chat-header {
            background: white;
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: white;
        }
        .logo-text {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--earth);
        }
        .logo-text span { color: var(--primary); }
        .back-button {
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            text-decoration: none;
            color: var(--muted);
            transition: 0.2s;
        }
        .back-button:hover { background: #e2e8f0; color: var(--primary); }
        
        /* Zone de langue */
        .lang-selector {
            display: flex;
            gap: 8px;
            background: #f1f5f9;
            padding: 4px 12px;
            border-radius: 40px;
        }
        .lang-btn {
            background: none;
            border: none;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--muted);
            transition: 0.2s;
        }
        .lang-btn.active {
            background: var(--primary);
            color: white;
        }
        
        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }
        .message.user .message-avatar { background: var(--primary); color: white; }
        .message-content {
            background: white;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            line-height: 1.5;
            color: #1e293b;
        }
        .message.user .message-content {
            background: var(--primary);
            color: white;
            border: none;
        }
        .message.bot .message-content { background: white; }
        
        /* Zone d'entrée */
        .chat-input-area {
            background: white;
            border-top: 1px solid var(--border);
            padding: 16px 20px;
        }
        .input-container {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 12px 18px;
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            transition: 0.2s;
            max-height: 150px;
        }
        textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(230,126,34,0.2); }
        button {
            background: var(--primary);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:hover { background: var(--primary-dark); transform: scale(1.02); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #cbd5e1;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-8px); } }
        
        @media (max-width: 600px) {
            .message { max-width: 95%; }
            .chat-header { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

<div class="chat-header">
    <div class="logo-area">
        <div class="logo-icon">X</div>
        <div class="logo-text">XA <span>IA</span></div>
        <a href="xa-ia-hub.html" class="back-button">← Retour à l'espace</a>
    </div>
    <div class="lang-selector">
        <button class="lang-btn active" data-lang="fr">FR</button>
        <button class="lang-btn" data-lang="snk">Soninké</button>
        <button class="lang-btn" data-lang="en">EN</button>
    </div>
</div>

<div class="chat-messages" id="chatMessages">
    <div class="message bot">
        <div class="message-avatar">🤖</div>
        <div class="message-content">
            <strong>Beeta ! 👋</strong><br>
            Je suis XA IA, l'assistant d'Andu-Xara. Je parle soninké, français et anglais.<br>
            Pose-moi une question sur l'histoire soninké, la langue, nos produits ou le concert de Pispa Le Roi.
        </div>
    </div>
</div>

<div class="chat-input-area">
    <div class="input-container">
        <textarea id="chatInput" rows="1" placeholder="Écrivez votre message... (Entrée pour envoyer, Shift+Entrée pour sauter une ligne)"></textarea>
        <button id="sendBtn" aria-label="Envoyer">➤</button>
    </div>
</div>

<script>
    // Configuration
    const API_URL = "https://xa-ia-worker.microsansfiltre2408.workers.dev";
    let currentLang = "fr";
    let isLoading = false;
    
    const messagesContainer = document.getElementById('chatMessages');
    const textarea = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    
    // Gestion de la langue
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentLang = btn.getAttribute('data-lang');
            addSystemMessage(`🧡 Langue changée : ${currentLang === 'fr' ? 'français' : currentLang === 'snk' ? 'soninké' : 'anglais'}. Je répondrai dans cette langue.`);
        });
    });
    
    function addSystemMessage(text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot';
        msgDiv.innerHTML = `
            <div class="message-avatar">ℹ️</div>
            <div class="message-content"><em>${text}</em></div>
        `;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function addMessage(text, isUser = false) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user' : 'bot'}`;
        msgDiv.innerHTML = `
            <div class="message-avatar">${isUser ? '👤' : '🤖'}</div>
            <div class="message-content">${text.replace(/\n/g, '<br>')}</div>
        `;
        messagesContainer.appendChild(msgDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function showTyping() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message bot';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = `
            <div class="message-avatar">🤖</div>
            <div class="message-content"><div class="typing-indicator"><span></span><span></span><span></span></div></div>
        `;
        messagesContainer.appendChild(typingDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function hideTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }
    
    async function sendMessage() {
        const message = textarea.value.trim();
        if (!message || isLoading) return;
        
        addMessage(message, true);
        textarea.value = '';
        textarea.style.height = 'auto';
        isLoading = true;
        showTyping();
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            let reply = data.response || "Je n'ai pas de réponse pour le moment.";
            // Nettoyer les éventuels messages d'erreur techniques
            if (reply.includes("Service temporairement indisponible")) {
                reply = "🔌 Je rencontre un problème technique. Réessaie dans quelques instants. 🧡";
            }
            hideTyping();
            addMessage(reply, false);
        } catch (error) {
            console.error('Chat error:', error);
            hideTyping();
            addMessage("🔌 Désolé, je n'arrive pas à contacter mon serveur. Réessaie plus tard ou contacte-nous sur WhatsApp +222 34 19 63 04. 🧡", false);
        }
        isLoading = false;
    }
    
    // Auto-resize textarea
    textarea.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 150) + 'px';
    });
    
    textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    
    sendBtn.addEventListener('click', sendMessage);
</script>
</body>
</html>
